name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: Verify no secrets in build output
        working-directory: web
        run: |
          if grep -RInE 'api[_-]?hash[[:space:]]*[:=][[:space:]]*["'"'"'][a-f0-9]{32}' dist; then
            echo "Possible hardcoded api_hash"
            exit 1
          fi
          if grep -RInE '["'"'"']1[A-Za-z0-9+/]{300,}' dist; then
            echo "Possible session string"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
