name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: Security scan of sources and dist
        run: |
          set -euo pipefail
          EXCLUDES=(--exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.specstory --exclude-dir=dist)
          if grep -RInE "${EXCLUDES[@]}" 'api[_-]?hash[[:space:]]*[:=][[:space:]]*["'"'"'][a-f0-9]{32}' .; then
            echo "Possible hardcoded api_hash"
            exit 1
          fi
          if grep -RInE "${EXCLUDES[@]}" 'session[[:space:]]*[:=][[:space:]]*["'"'"']1[A-Za-z0-9+/]{100,}' .; then
            echo "Possible session string"
            exit 1
          fi
          test ! -d server
          test ! -f netlify.toml
          test ! -f vercel.json
          grep -R "DeleteHistory" web/src >/dev/null
          grep -R "no application backend" web/dist/index.html >/dev/null
